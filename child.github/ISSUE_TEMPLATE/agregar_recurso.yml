name: Pedir o sugerir un recurso
description: Pide material que falta o sugiere algo para agregar.
title: "[Recurso] "
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por ayudar! Si ya tienes el material, también puedes subirlo tú mismo con un pull request (mira la guía de contribución).
  - type: input
    id: materia
    attributes:
      label: Materia
      description: ¿A qué materia pertenece?
      placeholder: "Ej: Análisis Matemático I"
    validations:
      required: true
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de recurso
      options:
        - Apunte o resumen
        - Práctico
        - Teórico o libro
        - Examen
        - Otro
    validations:
      required: true
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: ¿Qué falta o qué te gustaría que se agregue?
    validations:
      required: true
  - type: input
    id: enlace
    attributes:
      label: Enlace (opcional)
      description: Si ya existe en algún lugar público, pega el enlace.
  - type: checkboxes
    id: confirmacion
    attributes:
      label: Antes de enviar
      options:
        - label: Revisé que este recurso todavía no está en el repositorio.
          required: true
