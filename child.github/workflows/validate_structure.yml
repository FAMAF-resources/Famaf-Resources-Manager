name: 'Validate Structure'

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  validate:
    name: Validate files added by the PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false

      # The validator is taken from the parent repository, not from the PR.
      - name: Checkout validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: FAMAF-resources/Famaf-Resources-Manager
          ref: main
          path: .famaf-resources-manager
          sparse-checkout: scripts/validate_structure.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Validate structure
        run: bash .famaf-resources-manager/scripts/validate_structure.sh
