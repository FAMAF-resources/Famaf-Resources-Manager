name: 'Pull Request Labeler'

on:
  # pull_request_target gives a writable token on PRs from forks. It is safe here
  # because the job never checks out or runs code from the PR: labeler reads its
  # configuration from the base branch and only calls the API.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, ready_for_review, labeled, unlabeled, reopened, synchronize]

permissions: {}

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label PR
        uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          repo-token: ${{ github.token }}
          # sync-labels: true (Opcional: elimina etiquetas si los archivos cambian)
